[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ezf3d"
version = "0.1.1"
description = "Headless reader for Autodesk Fusion 360 .f3d / .f3z designs — no Fusion required"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "ezf3d contributors" }]
# cadquery-ocp (needed from Phase 4 onward) ships macOS arm64 wheels only through
# cp313. Pinning now so the venv does not have to be rebuilt later.
requires-python = ">=3.13,<3.14"
keywords = ["fusion360", "f3d", "cad", "acis", "shapemanager", "headless", "agentic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "zstandard>=0.22",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[project.scripts]
ezf3d = "ezf3d.cli:app"

[project.urls]
Repository = "https://github.com/AlexSabaka/ezf3d"
Issues = "https://github.com/AlexSabaka/ezf3d/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ezf3d"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001 flags the multiplication sign; it is deliberate in rendered output.
ignore = ["RUF001"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.flake8-bugbear]
# typer puts Option/Argument sentinels in parameter defaults by design.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
